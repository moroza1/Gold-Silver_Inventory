<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMIMS Audit Trail - System-Wide Activity Log</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 6px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
            font-size: 12px;
            text-transform: uppercase;
        }

        input, select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-search {
            background: #667eea;
            color: white;
            align-self: flex-end;
            margin-top: 25px;
        }

        .btn-search:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-export {
            background: #28a745;
            color: white;
            margin-left: 5px;
        }

        .btn-export:hover {
            background: #218838;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-card.kfhonline {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .stat-card.success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .table-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }

        .table-container {
            overflow-x: auto;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8f9fa;
            border-bottom: 2px solid #ddd;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            font-size: 13px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            color: #555;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .module-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
        }

        .module-kfhonline {
            background: #fff3cd;
            color: #856404;
        }

        .module-inventory {
            background: #d1ecf1;
            color: #0c5460;
        }

        .module-default {
            background: #e2e3e5;
            color: #383d41;
        }

        .action-text {
            max-width: 400px;
            word-wrap: break-word;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.4;
        }

        .timestamp {
            font-size: 12px;
            color: #999;
            white-space: nowrap;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .pagination {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .pagination button {
            padding: 8px 15px;
            margin: 0 5px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .pagination button:hover {
            background: #5568d3;
        }

        .pagination button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .keyword-highlight {
            background: #fff3cd;
            padding: 2px 4px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 PMIMS Audit Trail - System-Wide Activity Log</h1>
        <p class="subtitle">View all operations from all channels: KFHOnline, WebUI, API, Batch Jobs, etc.</p>

        <div class="controls">
            <div class="control-group">
                <label>Search Activity</label>
                <input type="text" id="query" placeholder="e.g., CUSTOMER_BUY">
            </div>
            <div class="control-group">
                <label>Module</label>
                <select id="module">
                    <option value="">-- All Modules --</option>
                    <option value="KFHOnline">KFHOnline (Customer Portal)</option>
                    <option value="Inventory">Inventory Management</option>
                    <option value="PurchaseOrders">Purchase Orders</option>
                    <option value="Transfers">Branch Transfers</option>
                    <option value="Reconciliation">Reconciliation</option>
                </select>
            </div>
            <div class="control-group">
                <label>Entity Type</label>
                <select id="entityType">
                    <option value="">-- All Entities --</option>
                    <option value="Customer">Customer</option>
                    <option value="InventoryItem">Inventory Item</option>
                    <option value="PurchaseOrder">Purchase Order</option>
                </select>
            </div>
            <div class="control-group">
                <label>From Date</label>
                <input type="date" id="fromDate">
            </div>
            <div class="control-group">
                <label>To Date</label>
                <input type="date" id="toDate">
            </div>
            <div class="control-group">
                <label>Tamper Status</label>
                <select id="status">
                    <option value="">-- All Status --</option>
                    <option value="verified">✓ Verified (Clean)</option>
                    <option value="unverified">? Unverified</option>
                    <option value="tampered">✗ Tampered (Alert!)</option>
                </select>
            </div>
            <div class="control-group">
                <button class="btn-search" onclick="loadLogs()">🔍 Search</button>
            </div>
        </div>

        <div class="table-controls">
            <button class="btn-export" onclick="exportLogs('xlsx')">📊 Export XLSX</button>
            <button class="btn-export" onclick="exportLogs('pdf')">📄 Export PDF</button>
            <button class="btn-export" onclick="exportLogs('csv')">📋 Export CSV</button>
        </div>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-number">-</div>
                <div class="stat-label">Total Activities</div>
            </div>
            <div class="stat-card kfhonline">
                <div class="stat-number">-</div>
                <div class="stat-label">KFHOnline Ops</div>
            </div>
            <div class="stat-card success">
                <div class="stat-number">-</div>
                <div class="stat-label">Verified Entries</div>
            </div>
        </div>

        <div class="table-container" id="tableContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading audit logs...</p>
            </div>
        </div>

        <div class="pagination" id="pagination"></div>
    </div>

    <script>
        const BACKEND_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:8080/api'
            : `http://${window.location.hostname}:8080/api`;
        let currentPage = 1;
        let totalCount = 0;
        const pageSize = 50;

        async function loadLogs(page = 1) {
            currentPage = page;
            const query = document.getElementById('query').value;
            const module = document.getElementById('module').value;
            const entityType = document.getElementById('entityType').value;
            const fromDate = document.getElementById('fromDate').value;
            const toDate = document.getElementById('toDate').value;
            const status = document.getElementById('status').value;

            let url = `${BACKEND_URL}/reports/audit-logs/search?page=${page}&pageSize=${pageSize}`;
            if (query) url += `&query=${encodeURIComponent(query)}`;
            if (module) url += `&module=${encodeURIComponent(module)}`;
            if (entityType) url += `&entityType=${encodeURIComponent(entityType)}`;
            if (fromDate) url += `&from=${fromDate}`;
            if (toDate) url += `&to=${toDate}`;
            if (status) url += `&status=${status}`;

            const container = document.getElementById('tableContainer');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading...</p></div>';

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (!response.ok) {
                    container.innerHTML = `<div class="no-data">❌ Error: ${data.error || 'Failed to load logs'}</div>`;
                    return;
                }

                const items = data.items || [];
                totalCount = data.total_count || 0;

                if (items.length === 0) {
                    container.innerHTML = '<div class="no-data">📭 No audit entries found</div>';
                    updateStats(items);
                    updatePagination();
                    return;
                }

                updateStats(items);
                renderTable(items);
                updatePagination();
            } catch (error) {
                container.innerHTML = `<div class="no-data">❌ Error: ${error.message}</div>`;
                console.error('Error loading logs:', error);
            }
        }

        function updateStats(items) {
            const total = totalCount;
            const kfhonline = items.filter(i => i.moduleName === 'KFHOnline').length;
            const verified = items.filter(i => i.tamperStatus === 'Verified').length;

            const statsHtml = `
                <div class="stat-card">
                    <div class="stat-number">${total}</div>
                    <div class="stat-label">Total Activities</div>
                </div>
                <div class="stat-card kfhonline">
                    <div class="stat-number">${kfhonline}</div>
                    <div class="stat-label">KFHOnline Ops</div>
                </div>
                <div class="stat-card success">
                    <div class="stat-number">${verified}</div>
                    <div class="stat-label">Verified Entries</div>
                </div>
            `;
            document.getElementById('stats').innerHTML = statsHtml;
        }

        function getModuleBadgeClass(module) {
            if (module === 'KFHOnline') return 'module-kfhonline';
            if (module === 'Inventory') return 'module-inventory';
            return 'module-default';
        }

        function renderTable(items) {
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Module</th>
                            <th>User</th>
                            <th>Action Description</th>
                            <th>Entity</th>
                            <th>IP Address</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            items.forEach(item => {
                const badgeClass = getModuleBadgeClass(item.moduleName);
                const date = new Date(item.timestamp).toLocaleString();
                const entity = item.entityType ? `${item.entityType}#${item.entityId || '-'}` : '-';
                const tamperIcon = item.tamperStatus === 'Verified' ? '✓' :
                                   item.tamperStatus === 'Tampered' ? '✗' : '?';

                html += `
                    <tr>
                        <td class="timestamp">${date}</td>
                        <td><span class="module-badge ${badgeClass}">${item.moduleName}</span></td>
                        <td><strong>${item.username}</strong></td>
                        <td><div class="action-text">${item.actionDescription}</div></td>
                        <td>${entity}</td>
                        <td style="font-size: 12px;">${item.ipAddress}</td>
                        <td><strong>${tamperIcon} ${item.tamperStatus}</strong></td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            document.getElementById('tableContainer').innerHTML = html;
        }

        function updatePagination() {
            const totalPages = Math.ceil(totalCount / pageSize);
            let html = `<span>Page ${currentPage} of ${totalPages} (${totalCount} total)</span>`;

            if (currentPage > 1) {
                html += `<button onclick="loadLogs(${currentPage - 1})">← Previous</button>`;
            }
            if (currentPage < totalPages) {
                html += `<button onclick="loadLogs(${currentPage + 1})">Next →</button>`;
            }

            document.getElementById('pagination').innerHTML = html;
        }

        async function exportLogs(format) {
            const query = document.getElementById('query').value;
            const module = document.getElementById('module').value;
            const entityType = document.getElementById('entityType').value;
            const fromDate = document.getElementById('fromDate').value;
            const toDate = document.getElementById('toDate').value;
            const status = document.getElementById('status').value;

            let url = `${BACKEND_URL}/reports/audit-logs/export?format=${format}`;
            if (query) url += `&query=${encodeURIComponent(query)}`;
            if (module) url += `&module=${encodeURIComponent(module)}`;
            if (entityType) url += `&entityType=${encodeURIComponent(entityType)}`;
            if (fromDate) url += `&from=${fromDate}`;
            if (toDate) url += `&to=${toDate}`;
            if (status) url += `&status=${status}`;

            window.open(url, '_blank');
        }

        // Load logs on page load
        window.addEventListener('DOMContentLoaded', loadLogs);
    </script>
</body>
</html>
