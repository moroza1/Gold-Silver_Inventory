name: Build and Publish Docker Images

on:
  push:
    branches: ["main", "master", "FIM"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Downcase repository owner
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check backend Docker SDK
        run: |
          grep -n "mcr.microsoft.com/dotnet" backend/Dockerfile

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          no-cache: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/pmims-backend:latest

      - name: Calculate and Inject App Version
        run: |
          COUNT=$(git rev-list --count HEAD)
          BUILD_NUM=$((COUNT - 44))
          if [ $BUILD_NUM -lt 0 ]; then BUILD_NUM=0; fi
          VERSION_STR=$(printf "1.%03d" $BUILD_NUM)
          echo "Building frontend with Version: $VERSION_STR (Total commits: $COUNT)"
          echo "export const APP_VERSION = \"$VERSION_STR\";" > frontend/src/version.ts

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          no-cache: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/pmims-frontend:latest
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/pmims-frontend:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/pmims-frontend:buildcache,mode=max
