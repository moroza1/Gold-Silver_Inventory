services:
  # 1. Backend ASP.NET Core API (.NET 10)
  backend:
    image: ghcr.io/moroza1/pmims-backend:latest
    container_name: pmims-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - DatabaseConfig__UseSqlServer=false
      - DatabaseConfig__SqliteConnection=Data Source=/app/data/pmims.db
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs

  # 2. Frontend React SPA (Nginx)
  frontend:
    image: ghcr.io/moroza1/pmims-frontend:latest
    container_name: pmims-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-data:
  backend-logs:


